<!DOCTYPE html>
<html>

<head>
    <title>Travel Banner Carousel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .carousel-item img {
            height: 500px;
            object-fit: cover;
        }

        .carousel-caption {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container mt-4">

        <h2 class="text-center mb-4">Bootstrap Banner Design</h2>

        <div id="banner" class="carousel slide" data-bs-ride="carousel">

            <!-- Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#banner" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#banner" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#banner" data-bs-slide-to="2"></button>
            </div>

            <!-- Slides -->
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200"
                        class="d-block w-100">

                    <div class="carousel-caption">
                        <h3>Explore Nature</h3>
                        <p>Enjoy beautiful mountains and fresh air.</p>
                        <button class="btn btn-success">Read More</button>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200"
                        class="d-block w-100">

                    <div class="carousel-caption">
                        <h3>Beach Adventure</h3>
                        <p>Experience the beauty of the ocean.</p>
                        <button class="btn btn-primary">Explore</button>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1200"
                        class="d-block w-100">

                    <div class="carousel-caption">
                        <h3>Travel The World</h3>
                        <p>Create unforgettable memories.</p>
                        <button class="btn btn-danger">Book Now</button>
                    </div>
                </div>

            </div>

            <!-- Controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#banner" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#banner" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
